# OfferGet 本地开发依赖
# MySQL 独立实例跑在 13307，不占用本机 3306 与其它项目的 3307
# Redis 跑在 13379，不占用本机 6379
services:
  mysql:
    image: mysql:8.0
    container_name: offerget-mysql
    restart: unless-stopped
    ports:
      - "13307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: offerget123
      MYSQL_DATABASE: offerget
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - offerget-mysql-data:/var/lib/mysql
      # 仅在数据卷首次初始化时执行；改表后需 docker compose down -v 重建
      - ./Mysql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -pofferget123 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4-alpine
    container_name: offerget-redis
    restart: unless-stopped
    ports:
      # 只绑定回环地址：Redis 无密码，避免同一网络内被直接访问
      - "127.0.0.1:13379:6379"
    command:
      - --appendonly
      - "yes"
    volumes:
      - offerget-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  offerget-mysql-data:
  offerget-redis-data:
