server:
  port: 8082

spring:
  application:
    name: offerget-server

  # 本地覆盖配置（真实密码、JWT 密钥）放 application-local.yml，已被 .gitignore 忽略；
  # 文件不存在时以下默认值依然可用，开箱即跑。
  config:
    import: optional:classpath:application-local.yml

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    # 默认连 docker-compose 的 13307；可用 DB_PORT 覆盖
    url: "jdbc:mysql://localhost:${DB_PORT:13307}/offerget?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false"
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:offerget123}

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 50MB

  tomcat:
    # 超限请求需要吞掉剩余数据才能正常返回 413，默认 2MB 会导致连接中断
    max-swallow-size: 50MB

  ai:
    deepseek:
      # 占位值保证不配 key 也能启动；业务侧 configured() 会把占位值视为未配置
      api-key: ${DEEPSEEK_API_KEY:not-configured}
      base-url: ${DEEPSEEK_BASE_URL:https://api.deepseek.com}
      chat:
        # 2.0 起 chat 选项直接挂在 chat 下，不再使用 chat.options.*
        # deepseek-chat / deepseek-reasoner 已于 2026-07-24 停止服务，当前为 deepseek-flash（V4.1 Flash）
        model: ${DEEPSEEK_MODEL:deepseek-flash}
        max-tokens: 8192

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false
    db-config:
      id-type: auto

app:
  jwt:
    # HS256 要求密钥不少于 32 字节；生产务必通过 APP_JWT_SECRET 覆盖
    secret: ${APP_JWT_SECRET:offerget-dev-secret-key-change-me-2027}
    expiration-seconds: ${APP_JWT_EXPIRATION_SECONDS:7200}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5175}
  file:
    # 简历文件存储根目录，相对后端运行目录
    storage-root: ${APP_FILE_STORAGE_ROOT:./uploads}
  crawl:
    schedule:
      # 每天定时采集关注公司的校招信息，enabled=false 可完全关闭
      enabled: ${CRAWL_SCHEDULE_ENABLED:true}
      cron: ${CRAWL_SCHEDULE_CRON:0 30 7 * * *}
      zone: ${CRAWL_SCHEDULE_ZONE:Asia/Shanghai}
      # 相邻两家公司之间的间隔，避免触发搜索接口限流
      company-delay-millis: ${CRAWL_COMPANY_DELAY_MS:2000}
  ai:
    deepseek:
      # chat 的连接与模型配置已迁到 spring.ai.deepseek.*；
      # 这里只保留 search/fetch 工具接口的读超时。
      timeout-seconds: ${DEEPSEEK_TIMEOUT_SECONDS:60}
